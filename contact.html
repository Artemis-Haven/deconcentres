    <link rel="icon" href="favicon.ico" sizes="32x32">

    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="backdrop" aria-hidden="true">
        <span class="backdrop-blob backdrop-blob--red tile-red"></span>
        <span class="backdrop-blob backdrop-blob--blue tile-blue"></span>
        <span class="backdrop-blob backdrop-blob--purple tile-purple"></span>
        <span class="backdrop-blob backdrop-blob--yellow tile-yellow"></span>
        <span class="backdrop-blob backdrop-blob--independent"></span>
    </div>

    <div class="page">

        <header class="doc-header">
            <a href="index.html" class="logo" aria-label="Déconcentrés, retour au jeu">
                <span class="logo-de" aria-hidden="true">DÉ</span><span class="logo-word" aria-hidden="true">CONCENTRÉS</span>
            </a>
            <a href="index.html" class="doc-back">← Retour au jeu</a>
        </header>

        <main class="doc">

            <h1>Contact</h1>

            <p>
                Une erreur dans les informations, un média à ajouter, un bug ou une idée ?
                Écrivez-moi ici. Votre e-mail est facultatif : laissez-le seulement si vous souhaitez une réponse.
            </p>

            <form id="contact-form" class="contact-form" action="https://api.web3forms.com/submit" method="POST">
                <input type="hidden" name="access_key" value="7d4766b3-3a94-4c57-a589-8ae264c8db3f">
                <input type="hidden" name="subject" value="Déconcentrés : nouveau message">
                <input type="hidden" name="from_name" value="Déconcentrés">
                <input type="checkbox" name="botcheck" class="contact-honeypot" tabindex="-1" autocomplete="off">

                <div class="contact-field">
                    <label for="contact-name">Nom ou pseudo <span class="contact-optional">(facultatif)</span></label>
                    <input id="contact-name" name="name" type="text" autocomplete="nickname" maxlength="100">
                </div>

                <div class="contact-field">
                    <label for="contact-email">E-mail <span class="contact-optional">(facultatif)</span></label>
                    <input id="contact-email" name="email" type="email" autocomplete="email" maxlength="200">
                </div>

                <div class="contact-field">
                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" required maxlength="5000"></textarea>
                </div>

                <button type="submit" class="contact-submit">Envoyer</button>

                <p id="contact-status" class="contact-status" role="status"></p>
            </form>

        </main>

        <footer class="footer">
            <p>Informations vérifiées en <span data-info-updated></span></p>
            <nav class="footer-links" aria-label="Informations sur le site">
                <a href="contact.html" aria-current="page">Contact</a>
                <a href="credits.html">Crédits</a>
                <a href="mentions-legales.html">Mentions légales</a>
            </nav>
        </footer>

    </div>

    <!-- GoatCounter -->
    <script data-goatcounter="https://artemis.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
    <script type="module" src="js/site.js"></script>
    <script type="module" src="js/contact.js"></script>
</body>
</html>
