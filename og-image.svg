        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#121418" stop-opacity="0"/>
            <stop offset="1" stop-color="#121418" stop-opacity=".85"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="630" fill="#121418"/>

